<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Luz Ambiental</title>

    <style>
        body {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        h1 {
            font-family: 'Segoe UI', sans-serif;
        }

        .lectura {
            border: 3px dotted white;
            border-radius: 20px;
            padding: 25px;
            margin: 30px auto;
            width: 300px;
        }

        .porcentaje {
            font-weight: bold;
            font-size: 40px;
        }
    </style>
</head>

<body>

    <h1>Monitor de Luz Ambiental</h1>

    <div class="lectura">
        <span>Nivel de Luz: <span class="porcentaje">50%</span></span>
    </div>

</body>
</html>
